<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Quran Digital - Dark Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Logika Tema: Cek localStorage, lalu cek sistem perangkat
        const getInitialTheme = () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) return savedTheme;
            
            // Cek preferensi sistem perangkat
            if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                return 'light';
            }
            // Default adalah dark
            return 'dark';
        };

        const initialTheme = getInitialTheme();
        document.documentElement.className = initialTheme;

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        arabic: ['Amiri', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .text-gold-shimmer {
            background: linear-gradient(
                to right, 
                #d9a327, 
                #f2cf66, 
                #d9a327
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .ayah-active {
            border-color: #d9a327 !important;
            background-color: rgba(217, 163, 39, 0.08);
            box-shadow: 0 0 25px rgba(217, 163, 39, 0.1);
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .light .glass {
            background: rgba(255, 255, 255, 0.85);
        }

        /* Optimalisasi Sentuhan Mobile */
        button, a {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 font-sans antialiased min-h-screen">

    <!-- Header Tetap -->
    <header class="sticky top-0 z-50 glass border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-5xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="btn-back" class="hidden p-2 rounded-lg transition-all hover:bg-slate-200 dark:hover:bg-slate-800" onclick="goHome()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="flex flex-col">
                    <h1 id="header-title" class="text-lg md:text-xl font-extrabold bg-gradient-to-r from-primary-500 to-teal-400 bg-clip-text text-transparent">Al-Quran Digital</h1>
                    <p id="header-subtitle" class="hidden md:block text-[10px] uppercase tracking-widest font-bold text-slate-500">Terjemahan Indonesia</p>
                </div>
            </div>
            
            <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-900 text-slate-600 dark:text-yellow-400 border border-transparent dark:border-slate-800 transition-all">
                <svg id="icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- Loading State -->
        <div id="loading-indicator" class="flex flex-col items-center justify-center py-40">
            <div class="w-12 h-12 rounded-full border-4 border-primary-500/20 border-t-primary-500 animate-spin"></div>
            <p class="mt-4 text-slate-500 text-sm font-medium">Bismillah, Memuat Data...</p>
        </div>

        <!-- Home View -->
        <div id="view-home" class="hidden space-y-6 fade-in">
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Cari nama surah..." 
                    class="w-full py-4 pl-12 pr-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:ring-2 ring-primary-500/30 outline-none transition-all"
                    oninput="handleSearch()"
                />
                <svg class="absolute left-4 top-4.5 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>

            <div id="surah-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- Surah View -->
        <div id="view-surah" class="hidden space-y-8 fade-in">
            <div id="surah-content"></div>
        </div>
    </main>

    <script>
        const API_URL = 'https://equran.id/api/v2';
        
        let state = {
            surahs: [],
            currentSurah: null,
            isDark: document.documentElement.classList.contains('dark'),
            playingKey: null,
            isFullPlay: false,
            audio: new Audio()
        };

        // Sinkronisasi Ikon Tema saat load
        function syncThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
            document.getElementById('icon-moon').classList.toggle('hidden', isDark);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            state.isDark = isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            syncThemeIcons();
        }

        async function init() {
            syncThemeIcons();
            state.audio.onended = handleAudioNext;

            try {
                const res = await fetch(`${API_URL}/surat`);
                const json = await res.json();
                state.surahs = json.data;
                renderList(state.surahs);
                document.getElementById('loading-indicator').classList.add('hidden');
                document.getElementById('view-home').classList.remove('hidden');
            } catch (err) {
                console.error(err);
            }
        }

        function renderList(data) {
            const grid = document.getElementById('surah-grid');
            grid.innerHTML = data.map(s => `
                <div onclick="openSurah(${s.nomor})" class="group p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl hover:border-primary-500/50 cursor-pointer transition-all">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold text-primary-600">
                                ${s.nomor}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-slate-100">${s.namaLatin}</h3>
                                <p class="text-[11px] text-slate-500 uppercase">${s.jumlahAyat} Ayat</p>
                            </div>
                        </div>
                        <div class="font-arabic text-xl text-gold-shimmer">${s.nama}</div>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = state.surahs.filter(s => s.namaLatin.toLowerCase().includes(q));
            renderList(filtered);
        }

        async function openSurah(no) {
            stopAudio();
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('hidden');
            
            try {
                const res = await fetch(`${API_URL}/surat/${no}`);
                const json = await res.json();
                state.currentSurah = json.data;
                
                renderDetail(json.data);
                
                document.getElementById('loading-indicator').classList.add('hidden');
                document.getElementById('view-surah').classList.remove('hidden');
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('header-title').textContent = json.data.namaLatin;
                window.scrollTo(0, 0);
            } catch (e) { console.error(e); }
        }

        function renderDetail(surah) {
            let html = `
                <div class="p-8 rounded-3xl bg-gradient-to-br from-slate-900 to-slate-800 text-white text-center border border-slate-700 shadow-xl">
                    <h2 class="text-5xl font-arabic text-gold-shimmer mb-4">${surah.nama}</h2>
                    <p class="text-primary-400 font-bold tracking-widest uppercase text-xs mb-6">${surah.arti} • ${surah.tempatTurun}</p>
                    <button onclick="toggleFullPlay()" id="master-play" class="flex items-center gap-2 mx-auto px-6 py-3 bg-primary-600 hover:bg-primary-500 rounded-xl font-bold transition-all">
                        <svg id="master-play-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <span id="master-play-text">Putar Surah</span>
                    </button>
                </div>
                <div class="space-y-6 mt-10">
            `;

            surah.ayat.forEach((a, i) => {
                const key = `ayat-${i}`;
                html += `
                    <div id="${key}" class="p-6 md:p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] transition-all">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-xs font-bold text-slate-400">${surah.nomor}:${a.nomorAyat}</span>
                            <button onclick="playSingle('${a.audio['05']}', '${key}', ${i})" class="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-primary-500">
                                <svg id="icon-${key}" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </button>
                        </div>
                        <p class="text-right font-arabic text-3xl md:text-4xl leading-[4rem] text-slate-800 dark:text-slate-100 mb-6">${a.teksArab}</p>
                        <p class="text-primary-500 dark:text-primary-400 text-sm italic mb-3">${a.teksLatin}</p>
                        <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">${a.teksIndonesia}</p>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('surah-content').innerHTML = html;
        }

        function goHome() {
            stopAudio();
            document.getElementById('view-surah').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('header-title').textContent = 'Al-Quran Digital';
        }

        // AUDIO LOGIC
        function playSingle(url, key, index) {
            if (state.playingKey === key) {
                stopAudio();
                return;
            }
            state.isFullPlay = false;
            startAudio(url, key, index);
        }

        function toggleFullPlay() {
            if (state.isFullPlay) {
                stopAudio();
            } else {
                state.isFullPlay = true;
                const firstAyat = state.currentSurah.ayat[0];
                startAudio(firstAyat.audio['05'], 'ayat-0', 0);
            }
        }

        function startAudio(url, key, index) {
            stopVisuals();
            state.audio.src = url;
            state.audio.play();
            state.playingKey = key;
            state.currentIndex = index;
            
            updateVisuals(key, true);
        }

        function handleAudioNext() {
            if (state.isFullPlay) {
                const nextIdx = state.currentIndex + 1;
                if (nextIdx < state.currentSurah.ayat.length) {
                    const nextAyat = state.currentSurah.ayat[nextIdx];
                    startAudio(nextAyat.audio['05'], `ayat-${nextIdx}`, nextIdx);
                } else {
                    stopAudio();
                }
            } else {
                stopAudio();
            }
        }

        function stopAudio() {
            state.audio.pause();
            stopVisuals();
            state.playingKey = null;
            state.isFullPlay = false;
            
            const mText = document.getElementById('master-play-text');
            const mIcon = document.getElementById('master-play-icon');
            if (mText) mText.textContent = "Putar Surah";
            if (mIcon) mIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
        }

        function updateVisuals(key, isPlaying) {
            const card = document.getElementById(key);
            const icon = document.getElementById(`icon-${key}`);
            if (card) {
                card.classList.add('ayah-active');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            if (icon) icon.innerHTML = `<rect width="14" height="14" x="5" y="5" rx="2"/>`;

            if (state.isFullPlay) {
                const mText = document.getElementById('master-play-text');
                const mIcon = document.getElementById('master-play-icon');
                if (mText) mText.textContent = "Berhenti";
                if (mIcon) mIcon.innerHTML = `<rect width="14" height="14" x="5" y="5" rx="2"/>`;
            }
        }

        function stopVisuals() {
            if (state.playingKey) {
                const card = document.getElementById(state.playingKey);
                const icon = document.getElementById(`icon-${state.playingKey}`);
                if (card) card.classList.remove('ayah-active');
                if (icon) icon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
            }
        }

        init();

        // Listener untuk perubahan tema sistem secara real-time
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                document.documentElement.className = e.matches ? 'dark' : 'light';
                syncThemeIcons();
            }
        });
    </script>
</body>
</html>
