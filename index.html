<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--=============== REMIXICONS ===============-->
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

        <!--=============== CSS ===============-->
        <link rel="stylesheet" href="assets/css/styles.css">

        <title>Antono - profile</title>
    </head>
    <body>
        <div class="container">
            <!-- Card -->
            <div class="card">
                <div class="card__border">
                    <div class="card__perfil">
                        <img src="assets/img/antono.png" alt="card image" class="card__img">
                    </div>
                </div>

                <h3 class="card__name">Antono</h3>
                <span class="card__profession">Frontend Developer</span>
  
                <!-- Card info -->
                <div class="info">
                    
                    <div class="info__icon">
                        <i class="ri-information-line"></i>
                    </div>

                    <div class="info__border">
                        <div class="info__perfil">
                            <img src="assets/img/dp.jpg" alt="card image" class="info__img">
                        </div>
                    </div>

                    <div class="info__data">
                        <h3 class="info__name">Antono</h3>
                        <span class="info__profession">Master in Frontend Developer</span>
                        <span class="info__location">bekasi - Indonesia</span>
                    </div>

                    <div class="info__social">
                        <a href="https://www.facebook.com/" target="_blank" class="info__social-link">
                            <span class="info__social-icon">
                                <i class="ri-facebook-box-line"></i>
                            </span>
                        </a>

                        <a href="https://antonobekasi.github.io/" target="_blank" class="info__social-link">
                            <span class="info__social-icon">
                                <i class="ri-open-source-fill"></i>
                            </span>
                        </a>

                        <a href="https://github.com/antono4/" target="_blank" class="info__social-link">
                            <span class="info__social-icon">
                                <i class="ri-github-fill"></i>
                            </span>
                        </a>
                        
                        <a href="https://gmail.com/" target="_blank" class="info__social-link">
                            <span class="info__social-icon">
                                <i class="ri-mail-fill"></i>
                            </span>
                        </a>
                    </div>
                   
                </div>
            </div>
                
        </div>
        
    </body>
</html>
