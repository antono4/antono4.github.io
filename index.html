<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Al-Quran Digital - Dark Mode Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Memastikan Mode Malam adalah default absolut sebelum konten dirender
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark'); // Set default ke dark di storage
            }
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#10b981',
                            600: '#059669',
                            950: '#022c22',
                        },
                        slate: {
                            950: '#0a0f1e', // Latar belakang ultra dark yang lebih elegan
                        }
                    },
                    fontFamily: {
                        arabic: ['Amiri', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Mencegah pergeseran warna saat loading */
        :root { color-scheme: dark; }
        .dark { background-color: #0a0f1e; color: #f8fafc; }
        
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }

        .text-gold-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ayah-card {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .ayah-active {
            border-color: #10b981 !important;
            background-color: rgba(16, 185, 129, 0.05);
            transform: scale(1.01);
        }

        .glass-nav {
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen font-sans">

    <!-- Navigasi -->
    <nav class="sticky top-0 z-50 glass-nav">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="btn-back" class="hidden p-2 rounded-full hover:bg-slate-800 transition-colors" onclick="handleBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <h1 id="nav-title" class="text-xl font-bold text-gold-gradient">Al-Quran Digital</h1>
            </div>
            
            <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-yellow-400" id="theme-toggle">
                <!-- Icon Sun -->
                <svg id="sun-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <!-- Icon Moon -->
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Search & Grid Home -->
        <div id="view-home" class="space-y-6">
            <div class="relative group">
                <input 
                    type="text" 
                    id="search-box"
                    placeholder="Cari surah (contoh: Al-Kahf)..." 
                    class="w-full py-4 pl-12 pr-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:border-primary-500 outline-none transition-all shadow-sm"
                    oninput="filterSurah()"
                />
                <svg class="absolute left-4 top-4 text-slate-400" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>

            <div id="surah-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Skeleton Loading -->
                <div class="animate-pulse bg-slate-800 h-20 rounded-2xl"></div>
                <div class="animate-pulse bg-slate-800 h-20 rounded-2xl"></div>
            </div>
        </div>

        <!-- View Surah Detail -->
        <div id="view-detail" class="hidden space-y-8 animate-in fade-in duration-500">
            <div id="surah-header" class="text-center p-10 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl">
                <!-- Header Content Dinamis -->
            </div>
            <div id="ayat-container" class="space-y-6"></div>
        </div>
    </main>

    <script>
        const API = 'https://equran.id/api/v2';
        let allSurahs = [];
        let currentAyatList = [];
        let currentAyatIdx = 0;
        let isFullPlay = false;
        const audio = new Audio();

        // Inisialisasi awal
        window.addEventListener('DOMContentLoaded', () => {
            updateThemeUI();
            fetchSurahs();
            audio.onended = playNext;
        });

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('sun-icon').classList.toggle('hidden', !isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', isDark);
            document.getElementById('theme-toggle').className = isDark 
                ? "p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-yellow-400"
                : "p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-600";
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI();
        }

        async function fetchSurahs() {
            try {
                const res = await fetch(`${API}/surat`);
                const json = await res.json();
                allSurahs = json.data;
                renderSurahList(allSurahs);
            } catch (e) {
                console.error("Gagal memuat surah");
            }
        }

        function renderSurahList(data) {
            const container = document.getElementById('surah-list');
            container.innerHTML = data.map(s => `
                <div onclick="loadSurah(${s.nomor})" class="p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-between cursor-pointer hover:border-primary-500 transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-primary-500/10 text-primary-500 font-bold text-sm">
                            ${s.nomor}
                        </div>
                        <div>
                            <h3 class="font-bold dark:text-white group-hover:text-primary-500 transition-colors">${s.namaLatin}</h3>
                            <p class="text-xs text-slate-500 font-medium">${s.jumlahAyat} Ayat • ${s.arti}</p>
                        </div>
                    </div>
                    <div class="font-arabic text-xl text-gold-gradient">${s.nama}</div>
                </div>
            `).join('');
        }

        function filterSurah() {
            const q = document.getElementById('search-box').value.toLowerCase();
            const filtered = allSurahs.filter(s => s.namaLatin.toLowerCase().includes(q));
            renderSurahList(filtered);
        }

        async function loadSurah(no) {
            stopAudio();
            document.getElementById('view-home').classList.add('hidden');
            const container = document.getElementById('view-detail');
            container.classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');

            try {
                const res = await fetch(`${API}/surat/${no}`);
                const json = await res.json();
                const s = json.data;
                currentAyatList = s.ayat;

                document.getElementById('nav-title').textContent = s.namaLatin;
                
                // Render Header
                document.getElementById('surah-header').innerHTML = `
                    <h2 class="text-5xl font-arabic text-gold-gradient mb-2">${s.nama}</h2>
                    <p class="text-primary-500 font-bold tracking-widest text-xs uppercase mb-6">${s.arti} — ${s.tempatTurun}</p>
                    <button onclick="toggleSurahAudio()" id="btn-master-play" class="px-8 py-3 bg-primary-600 hover:bg-primary-500 text-white rounded-full font-bold flex items-center gap-3 mx-auto transition-all shadow-lg shadow-primary-500/20">
                        <svg id="master-icon" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <span id="master-text">Putar Surah</span>
                    </button>
                `;

                // Render Ayat
                document.getElementById('ayat-container').innerHTML = s.ayat.map((a, i) => `
                    <div id="card-${i}" class="ayah-card p-6 md:p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-xs font-bold text-slate-500 bg-slate-800 px-3 py-1 rounded-full">${s.nomor}:${a.nomorAyat}</span>
                            <button onclick="playSingle(${i})" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800 text-primary-500 hover:bg-primary-500 hover:text-white transition-all">
                                <svg id="play-icon-${i}" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </button>
                        </div>
                        <p class="text-right font-arabic text-3xl md:text-4xl leading-relaxed dark:text-slate-100 mb-6">${a.teksArab}</p>
                        <p class="text-primary-500 text-sm italic mb-3 font-medium">${a.teksLatin}</p>
                        <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">${a.teksIndonesia}</p>
                    </div>
                `).join('');
                window.scrollTo(0,0);
            } catch (e) { console.error(e); }
        }

        function handleBack() {
            stopAudio();
            document.getElementById('view-detail').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('nav-title').textContent = "Al-Quran Digital";
        }

        // Audio Engine
        function toggleSurahAudio() {
            if (isFullPlay) {
                stopAudio();
            } else {
                isFullPlay = true;
                playAyat(0);
            }
        }

        function playSingle(idx) {
            isFullPlay = false;
            playAyat(idx);
        }

        function playAyat(idx) {
            if (idx >= currentAyatList.length) {
                stopAudio();
                return;
            }

            clearVisuals();
            currentAyatIdx = idx;
            const ayat = currentAyatList[idx];
            audio.src = ayat.audio['05'];
            audio.play();

            // Update UI
            const card = document.getElementById(`card-${idx}`);
            if (card) {
                card.classList.add('ayah-active');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            const icon = document.getElementById(`play-icon-${idx}`);
            if (icon) icon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;

            const mText = document.getElementById('master-text');
            const mIcon = document.getElementById('master-icon');
            if (isFullPlay && mText) {
                mText.textContent = "Berhenti";
                mIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
            }
        }

        function playNext() {
            if (isFullPlay) {
                playAyat(currentAyatIdx + 1);
            } else {
                stopAudio();
            }
        }

        function stopAudio() {
            audio.pause();
            isFullPlay = false;
            clearVisuals();
            const mText = document.getElementById('master-text');
            const mIcon = document.getElementById('master-icon');
            if (mText) {
                mText.textContent = "Putar Surah";
                mIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
            }
        }

        function clearVisuals() {
            document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('ayah-active'));
            document.querySelectorAll('[id^="play-icon-"]').forEach(i => {
                i.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
            });
        }
    </script>
</body>
</html>
