name: Auto commit

on:
  push:
    branches:
      - main
    paths-ignore:
      - LAST_UPDATED
  schedule:
    - cron: "10-59/30 * * * *"

permissions:
  contents: write

concurrency:
  group: readme-updater
  cancel-in-progress: false

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup git identity
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "73228642+antono4@users.noreply.github.com"
          git config --local user.name "antono4"

      - name: Commit and push with retry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          messages=(
            "chore(bot): 😂 auto commit"
            "chore(bot): 😱 auto commit"
            "chore(bot): 👿 auto commit"
            "chore(bot): 💩 auto commit"
            "chore(bot): 🙏 auto commit"
            "chore(bot): 🙈 auto commit"
            "chore(bot): 🐐 auto commit"
            "chore(bot): 🤖 auto commit"
            "chore(bot): 🟩 auto commit"
            "chore(bot): 👻 auto commit"
          )

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"
            git fetch origin main --prune
            git checkout -B main origin/main

            printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > LAST_UPDATED
            git add LAST_UPDATED

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "${messages[$((RANDOM % ${#messages[@]}))]}"

            if git push origin HEAD:refs/heads/main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed because main changed; retrying..."
            git reset --hard origin/main
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts"
          exit 1
