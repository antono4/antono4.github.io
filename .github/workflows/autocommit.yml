name: Auto commit

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-commit
  cancel-in-progress: true

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup git identity
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "73228642+antono4@users.noreply.github.com"
          git config --local user.name "antono4"

      - name: Sync with remote main
        shell: bash
        run: |
          git fetch origin main --prune
          git checkout -B main origin/main
          git pull --ff-only origin main || true

      - name: Modify last update
        shell: bash
        run: |
          d=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf '%s\n' "$d" > LAST_UPDATED

      - name: Commit changes
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          arr[0]="chore(bot): 😂 auto commit"
          arr[1]="chore(bot): 😱 auto commit"
          arr[2]="chore(bot): 👿 auto commit"
          arr[3]="chore(bot): 💩 auto commit"
          arr[4]="chore(bot): 🙏 auto commit"
          arr[5]="chore(bot): 🙈 auto commit"
          arr[6]="chore(bot): 🐐 auto commit"
          arr[7]="chore(bot): 🤖 auto commit"
          arr[8]="chore(bot): 🟩 auto commit"
          arr[9]="chore(bot): 👻 auto commit"

          rand=$((RANDOM % ${#arr[@]}))
          git commit -m "${arr[$rand]}"

      - name: Push changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
