<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global TV - Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
        }

        .glass {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }

        .sidebar-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .channel-card {
            transition: all 0.2s ease;
        }
        .channel-card:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: translateX(4px);
        }

        .active-channel {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0) 100%);
            border-left: 3px solid #ef4444;
        }

        .video-gradient {
            background: linear-gradient(to top, rgba(9, 9, 11, 1) 0%, rgba(9, 9, 11, 0) 50%);
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-live {
            animation: pulse-red 2s infinite;
        }

        select option {
            background: #18181b;
            color: white;
        }
    </style>
</head>
<body class="text-zinc-100 overflow-hidden">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar-transition w-80 glass flex flex-col overflow-hidden shrink-0 z-40">
            <!-- Header Sidebar -->
            <div class="p-6 border-b border-white/5">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/20">
                        <i data-lucide="tv-2" class="text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-none tracking-tight">GLOBAL<span class="text-red-500">TV</span></h1>
                        <p class="text-[10px] text-zinc-500 font-medium tracking-widest uppercase mt-1">Premium Edition</p>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <!-- Search Input -->
                    <div class="relative group">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-500 group-focus-within:text-red-500 transition-colors"></i>
                        <input 
                            type="text" 
                            id="searchInput"
                            placeholder="Cari saluran..." 
                            class="w-full bg-white/5 border border-white/5 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:ring-1 focus:ring-red-500/50 focus:bg-white/10 transition-all outline-none"
                        >
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <!-- Country Filter -->
                        <div class="relative">
                            <i data-lucide="globe" class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-zinc-400 pointer-events-none"></i>
                            <select 
                                id="countryFilter"
                                class="w-full bg-white/5 border border-white/5 rounded-xl py-2 pl-8 pr-4 text-[11px] appearance-none cursor-pointer focus:ring-1 focus:ring-red-500/50 outline-none hover:bg-white/10 transition-all"
                            >
                                <option value="All">Semua Negara</option>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 h-3 w-3 text-zinc-500 pointer-events-none"></i>
                        </div>

                        <!-- Category Filter -->
                        <div class="relative">
                            <i data-lucide="layers" class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-zinc-400 pointer-events-none"></i>
                            <select 
                                id="categoryFilter"
                                class="w-full bg-white/5 border border-white/5 rounded-xl py-2 pl-8 pr-4 text-[11px] appearance-none cursor-pointer focus:ring-1 focus:ring-red-500/50 outline-none hover:bg-white/10 transition-all"
                            >
                                <option value="All">Kategori</option>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 h-3 w-3 text-zinc-500 pointer-events-none"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Channel List -->
            <div id="channelList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <div class="flex flex-col items-center justify-center h-full text-zinc-600 space-y-4">
                    <div class="w-8 h-8 border-2 border-red-500/30 border-t-red-500 rounded-full animate-spin"></div>
                    <span class="text-xs font-medium">Sinkronisasi Saluran...</span>
                </div>
            </div>

            <!-- Footer Sidebar -->
            <div class="p-4 border-t border-white/5 bg-black/20">
                <p class="text-[10px] text-center text-zinc-500 uppercase tracking-tighter">© 2024 Global TV Premium</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col bg-zinc-950 relative overflow-hidden">
            <!-- Background Ambient Glow -->
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-red-600/10 blur-[120px] rounded-full"></div>
            <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-600/5 blur-[120px] rounded-full"></div>

            <!-- Top Header -->
            <div class="absolute top-0 left-0 right-0 h-20 flex items-center justify-between px-8 z-30 pointer-events-none">
                <button 
                    id="toggleSidebar"
                    class="p-2.5 glass rounded-xl hover:bg-red-600 transition-all shadow-xl pointer-events-auto active:scale-95"
                >
                    <i data-lucide="menu" id="toggleIcon" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center gap-4 pointer-events-auto">
                    <button class="p-2.5 text-zinc-400 hover:text-white transition-colors">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                    </button>
                    <div class="h-8 w-[1px] bg-white/10"></div>
                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-orange-400 p-[2px]">
                        <div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center overflow-hidden">
                            <i data-lucide="user" class="w-5 h-5 text-zinc-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Player Section -->
            <div id="mainStage" class="flex-1 flex flex-col">
                <div id="playerContainer" class="flex-1 flex flex-col items-center justify-center relative">
                    <!-- Default Welcome Screen -->
                    <div id="welcomeScreen" class="text-center p-12 max-w-lg">
                        <div class="w-32 h-32 bg-zinc-900/50 rounded-3xl border border-white/5 flex items-center justify-center mb-8 mx-auto shadow-2xl relative">
                            <i data-lucide="play" class="text-red-500 fill-red-500 ml-1" size="48"></i>
                            <div class="absolute inset-0 bg-red-500 blur-3xl opacity-10"></div>
                        </div>
                        <h2 class="text-3xl font-bold mb-4 tracking-tight">Eksplorasi Dunia</h2>
                        <p class="text-zinc-500 leading-relaxed">
                            Pilih ribuan saluran televisi dari berbagai negara dan nikmati pengalaman menonton premium tanpa gangguan.
                        </p>
                    </div>
                </div>

                <!-- Info Bar (Glass Style) -->
                <div id="metadataArea" class="hidden p-8 relative z-20">
                    <div class="glass p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl border border-white/10">
                        <div class="flex items-center gap-6">
                            <div id="currentLogo" class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center p-3 shadow-2xl ring-4 ring-black/50 overflow-hidden">
                                <!-- Logo TV -->
                            </div>
                            <div>
                                <div class="flex items-center gap-3 mb-1">
                                    <h2 id="currentName" class="text-2xl md:text-3xl font-extrabold tracking-tight">NAMA CHANNEL</h2>
                                    <div class="flex items-center gap-1.5 bg-red-500 px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-wider animate-live">
                                        LIVE
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 text-zinc-400 text-sm font-medium">
                                    <span class="flex items-center gap-1.5">
                                        <i data-lucide="map-pin" class="w-4 h-4 text-red-500"></i>
                                        <span id="currentCountry">International</span>
                                    </span>
                                    <div class="w-1 h-1 rounded-full bg-zinc-700"></div>
                                    <span class="flex items-center gap-1.5">
                                        <i data-lucide="tag" class="w-4 h-4 text-blue-500"></i>
                                        <span id="currentCategory">Entertainment</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            <button class="p-3 bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/5" title="Tambah Favorit">
                                <i data-lucide="heart" class="w-5 h-5"></i>
                            </button>
                            <button class="p-3 bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/5" title="Bagikan">
                                <i data-lucide="share-2" class="w-5 h-5"></i>
                            </button>
                            <button class="px-6 py-3 bg-red-600 hover:bg-red-700 rounded-2xl font-bold text-sm transition-all shadow-lg shadow-red-600/20 active:scale-95">
                                Laporkan Masalah
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // State Management
        let allChannels = [];
        let isSidebarOpen = true;
        let selectedId = null;
        const STREAM_SOURCE = "https://iptv-org.github.io/iptv/index.m3u";

        // Element Selectors
        const channelList = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const countryFilter = document.getElementById('countryFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const toggleIcon = document.getElementById('toggleIcon');
        const playerContainer = document.getElementById('playerContainer');
        const metadataArea = document.getElementById('metadataArea');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function updateIcons() {
            try {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            } catch (err) {
                console.warn("Gagal memperbarui ikon:", err);
            }
        }

        async function fetchChannels() {
            try {
                const response = await fetch(STREAM_SOURCE);
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                console.error("Gagal memuat:", error);
                channelList.innerHTML = `
                    <div class="p-10 text-center">
                        <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="alert-circle" class="text-red-500"></i>
                        </div>
                        <p class="text-sm text-zinc-500">Gagal memuat saluran.</p>
                    </div>
                `;
                updateIcons();
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const result = [];
            let currentItem = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.*)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const countryMatch = line.match(/group-title="([^"]*)"/);
                    
                    currentItem.name = nameMatch ? nameMatch[1].trim() : "Unknown Channel";
                    currentItem.logo = logoMatch ? logoMatch[1] : null;
                    currentItem.country = countryMatch ? countryMatch[1] : "International";
                    
                    // Ekstraksi kategori dari group-title jika memungkinkan atau set default
                    // Biasanya M3U iptv-org memiliki format kategori tertentu
                    currentItem.category = currentItem.country; 
                } else if (line.startsWith('http')) {
                    currentItem.url = line;
                    if (currentItem.name) {
                        result.push({ ...currentItem, id: Math.random().toString(36).substr(2, 9) });
                    }
                    currentItem = {};
                }
            }

            allChannels = result.sort((a, b) => a.name.localeCompare(b.name));
            populateFilters();
            renderChannels(allChannels.slice(0, 150));
        }

        function populateFilters() {
            // Populate Countries
            const countries = [...new Set(allChannels.map(ch => ch.country))].sort();
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countryFilter.appendChild(option);
            });

            // Populate Categories (Using group-title logic)
            // Di sini kita bisa membuat kategori buatan atau berdasarkan data yang ada
            const categories = ["News", "Sports", "Movies", "Music", "Entertainment", "Documentary", "Kids", "Education"];
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categoryFilter.appendChild(option);
            });
            updateIcons();
        }

        function renderChannels(channels) {
            channelList.innerHTML = '';
            if (channels.length === 0) {
                channelList.innerHTML = `<div class="p-10 text-center text-zinc-600 text-xs font-medium">Tidak ada hasil</div>`;
                updateIcons();
                return;
            }

            const fragment = document.createDocumentFragment();
            channels.forEach(ch => {
                const btn = document.createElement('button');
                const isActive = selectedId === ch.id;
                
                btn.className = `channel-card w-full flex items-center gap-4 p-3.5 rounded-2xl transition-all text-left group ${isActive ? 'active-channel' : ''}`;
                btn.onclick = () => {
                    selectedId = ch.id;
                    renderChannels(channels); 
                    selectChannel(ch);
                };
                
                const logoContent = ch.logo 
                    ? `<img src="${ch.logo}" alt="" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/40x40/18181b/white?text=TV'">`
                    : `<i data-lucide="tv" class="text-zinc-600" size="16"></i>`;

                btn.innerHTML = `
                    <div class="w-11 h-11 bg-zinc-800 rounded-xl flex items-center justify-center overflow-hidden shrink-0 border border-white/5 shadow-inner group-hover:scale-105 transition-transform">
                        ${logoContent}
                    </div>
                    <div class="overflow-hidden flex-1">
                        <p class="text-xs font-semibold truncate leading-tight ${isActive ? 'text-red-500' : 'text-zinc-200'}">${ch.name}</p>
                        <p class="text-[9px] text-zinc-500 font-bold uppercase mt-1 tracking-tight">${ch.country}</p>
                    </div>
                    <i data-lucide="play-circle" class="w-4 h-4 text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                `;
                fragment.appendChild(btn);
            });
            channelList.appendChild(fragment);
            updateIcons();
        }

        function selectChannel(ch) {
            welcomeScreen.style.display = 'none';
            metadataArea.classList.remove('hidden');
            document.getElementById('currentName').textContent = ch.name;
            document.getElementById('currentCountry').textContent = ch.country;
            document.getElementById('currentCategory').textContent = ch.category || "General";
            document.getElementById('currentLogo').innerHTML = ch.logo 
                ? `<img src="${ch.logo}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/80x80/18181b/white?text=TV'">`
                : `<i data-lucide="tv-2" class="text-zinc-800 w-8 h-8"></i>`;
            
            playerContainer.innerHTML = `
                <div class="w-full h-full flex items-center justify-center p-0 md:p-8 animate-in fade-in duration-500">
                    <div class="w-full max-w-5xl aspect-video glass rounded-3xl overflow-hidden shadow-2xl relative border border-white/5 bg-black">
                        <video id="videoPlayer" controls autoplay class="w-full h-full">
                            Browser tidak mendukung.
                        </video>
                    </div>
                </div>
            `;

            const video = document.getElementById('videoPlayer');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
            }
            updateIcons();
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const country = countryFilter.value;
            const category = categoryFilter.value;

            const filtered = allChannels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(query);
                const matchesCountry = country === "All" || ch.country === country;
                
                // Logika kategori (menyederhanakan pencarian string di nama jika kategori murni tidak ada)
                const matchesCategory = category === "All" || 
                                       ch.name.toLowerCase().includes(category.toLowerCase()) ||
                                       ch.country.toLowerCase().includes(category.toLowerCase());

                return matchesSearch && matchesCountry && matchesCategory;
            });

            renderChannels(filtered.slice(0, 150));
        }

        searchInput.oninput = applyFilters;
        countryFilter.onchange = applyFilters;
        categoryFilter.onchange = applyFilters;

        toggleSidebar.onclick = () => {
            isSidebarOpen = !isSidebarOpen;
            sidebar.style.width = isSidebarOpen ? '20rem' : '0';
            toggleIcon.setAttribute('data-lucide', isSidebarOpen ? 'x' : 'menu');
            updateIcons();
        };

        window.addEventListener('load', () => {
            updateIcons();
            fetchChannels();
        });
    </script>
</body>
